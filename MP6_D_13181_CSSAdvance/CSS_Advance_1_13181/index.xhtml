<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="id" lang="id">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <title>Pendaftaran Kompetisi 2026</title>
    <link rel="stylesheet" type="text/css" href="style.css" />
</head>
<body>
    <h1>Pendaftaran Kompetisi 2026</h1>
    <form action="" method="post" enctype="multipart/form-data">
        <table cellspacing="4" cellpadding="4" border="1"
               style="border-collapse:collapse;">
               <tr>
                    <td>
                        <label for="namatim"><strong>Nama Tim</strong></label>
                    </td>
                    <td>
                        <input type="text" id="namatim" name="namatim" size="30"/>
                    </td>
               </tr>
               <tr>
                    <td>
                        <label for="ketua"><strong>Nama Ketua Tim</strong></label>
                    </td>
                    <td>
                        <input type="text" id="ketua" name="ketua" size="30"/>
                    </td>
               </tr> 
               <tr>
                    <td>
                        <label for="jumlah"><strong>Jumlah Anggota</strong></label>
                    </td>
                    <td>
                        <select id="jumlah" name="jumlah">
                            <option>1 anggota</option>
                            <option>2 anggota</option>
                            <option>3 anggota</option>
                            <option>4 anggota</option>
                            <option>5 anggota</option>
                        </select>
                    </td>
               </tr>
               <tr>
                    <td>
                        <label for="telepon"><strong>Nomor Telepon Ketua Tim</strong></label>
                    </td>
                    <td>
                        <input type="text" id="telepon" name="telepon" size="30"/>
                    </td>
               </tr>
               <tr>
                    <td>
                        <label for="instansi"><strong>Asal Instansi</strong></label>
                    </td>
                    <td>
                        <input type="text" id="instansi" name="instansi" size="30" />
                    </td>
               </tr>
               <tr>
                    <td style="vertical-align:top;"><strong>Kategori Lomba</strong></td>
                    <td>
                        <p>
                            <input type="checkbox" id="coding" name="kategori" value="Coding" />
                            <label for="coding">Coding</label>
                            <input type="checkbox" id="desain" name="kategori" value="Desain" />
                            <label for="desain">Graphic Design</label>
                        </p>
                        <p>
                            <input type="checkbox" id="video" name="kategori" value="Video" />
                            <label for="video">Video</label>
                            <input type="checkbox" id="essay" name="kategori" value="Essay" />
                            <label for="essay">Essay</label>
                        </p>
                    </td>
               </tr>
               <tr>
                    <td><strong>Jenis Peserta</strong></td>
                    <td>
                        <input type="radio" id="mahasiswa" name="peserta" value="Mahasiswa"/>
                        <label for="mahasiswa">Mahasiswa</label>
                        <input type="radio" id="umum" name="peserta" value="Umum" />
                        <label for="umum">Umum</label>
                    </td>
               </tr>
               <tr>
                    <td style="vertical-align:top;">
                        <label for="judul"><strong>Judul Karya</strong></label>
                    </td>
                    <td>
                        <input type="text" id="judul" name="judul" size="30" />
                    </td>
               </tr>
               <tr>
                    <td style="vertical-align:top;">
                        <label for="deskripsi"><strong>Deskripsi Karya</strong></label>
                    </td>
                    <td>
                        <textarea id="deskripsi" name="deskripsi" rows="10" cols="30"></textarea>
                    </td>
               </tr>
               <tr>
                    <td style="vertical-align:top;">
                        <label for="motivasi"><strong>Motivasi mengikuti Lomba</strong></label>
                    </td>
                    <td>
                        <textarea id="motivasi" name="motivasi" rows="7" cols="30"></textarea>
                    </td>
               </tr>
               <tr>
                    <td>
                        <label for="filekarya"><strong>Upload Karya</strong></label>
                    </td>
                    <td>
                        <input type="file" id="filekarya" name="filekarya" accept="application/pdf, image/jpeg, image/png" />
                    </td>
               </tr>
               <tr>
                    <td colspan="2" style="text-align:center;">
                        <input type="submit" id="daftar" name="daftar" value="Daftar"/>
                    </td>
               </tr>
        </table>
    </form>
</body>
</html>
